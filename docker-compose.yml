services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: apple-health-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health}
      POSTGRES_USER: ${POSTGRES_USER:-health_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - timescale_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [health_internal]
    shm_size: 128mb

  api:
    build: .
    container_name: apple-health-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set API_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Keep telemetry on the private Compose network. The LGTM container
      # accepts OTLP/HTTP and routes logs, metrics, and traces to its bundled
      # Loki, Mimir, and Tempo backends.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      timescaledb:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [health_internal]

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: apple-health-lgtm
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Existing installations can start before adding the new variable, but
      # should set a distinct Grafana password as shown in .env.example.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${GRAFANA_DB_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD or GRAFANA_DB_PASSWORD in .env}}
      GRAFANA_DB_HOST: timescaledb:5432
      GRAFANA_DB_NAME: ${POSTGRES_DB:-health}
      GRAFANA_DB_USER: grafana_reader
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - lgtm_data:/data
      - ./grafana/provisioning/dashboards/apple-health.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/apple-health.yaml:ro
      - ./grafana/provisioning/datasources/apple-health-postgres.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/apple-health-postgres.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/grafana/dashboards/apple-health:ro
    ports:
      # OTLP port 4318 intentionally remains private. The API reaches it as
      # http://lgtm:4318 over health_internal.
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks: [health_internal]
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescale_data:
  lgtm_data:

networks:
  health_internal:
    driver: bridge
