apiVersion: 1

datasources:
  - name: Apple Health PostgreSQL
    uid: apple-health-postgres
    type: postgres
    access: proxy
    url: $GRAFANA_DB_HOST
    user: $GRAFANA_DB_USER
    database: $GRAFANA_DB_NAME
    isDefault: false
    editable: false
    jsonData:
      database: $GRAFANA_DB_NAME
      postgresVersion: 1800
      sslmode: disable
      timescaledb: true
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
